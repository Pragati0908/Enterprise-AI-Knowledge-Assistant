name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# --------------------------------------------------
# GitHub Container Registry configuration
# --------------------------------------------------
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:

    runs-on: ubuntu-latest

    # Required for publishing the Docker image to GHCR
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: backend

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up the same Python version used locally
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      # --------------------------------------------------
      # 3. Upgrade pip
      # --------------------------------------------------
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # --------------------------------------------------
      # 4. Install Tesseract OCR
      # --------------------------------------------------
      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      # --------------------------------------------------
      # 5. Install Ollama
      # --------------------------------------------------
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      # --------------------------------------------------
      # 6. Start Ollama server
      # --------------------------------------------------
      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &

          echo "Waiting for Ollama to start..."

          for i in {1..30}; do
            if curl -s http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "Ollama is running."
              break
            fi

            echo "Waiting for Ollama..."
            sleep 2
          done

          if ! curl -s http://127.0.0.1:11434/api/tags > /dev/null; then
            echo "Ollama failed to start."
            cat /tmp/ollama.log
            exit 1
          fi

      # --------------------------------------------------
      # 7. Download the exact model used by the application
      # --------------------------------------------------
      - name: Pull Ollama model
        run: |
          ollama pull llama3.2

      # --------------------------------------------------
      # 8. Verify Ollama
      # --------------------------------------------------
      - name: Verify Ollama
        run: |
          echo "Available Ollama models:"
          ollama list

      # --------------------------------------------------
      # 9. Install Python dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # --------------------------------------------------
      # 10. Run complete test suite
      # --------------------------------------------------
      - name: Run tests
        run: |
          pytest -v

      # ==================================================
      # DOCKER / GHCR PUBLISHING
      # ==================================================

      # --------------------------------------------------
      # 11. Log in to GitHub Container Registry
      # --------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 12. Generate Docker image metadata
      # --------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # --------------------------------------------------
      # 13. Build and push Docker image
      # --------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}